<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Modelo en Realidad Aumentada</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        model-viewer {
            width: 100vw;
            height: 90vh;
            background-color: #f0f0f0;
        }
        .instrucciones {
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="BodegaJumbo.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        poster="poster.webp" 
        shadow-intensity="1" 
        auto-rotate>
        
        <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
            👋 Ver en mi espacio
        </button>
    </model-viewer>

    <div class="instrucciones">
        <p>Toca el botón para activar la Realidad Aumentada</p>
    </div>

</body>
</html>
