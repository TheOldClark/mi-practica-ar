<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor AR - Bodega Jumbo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; }
        
        /* Contenedor del modelo */
        model-viewer {
            width: 100vw;
            height: 85vh;
            background-color: #252525; /* Color oscuro mientras carga */
            --poster-color: transparent;
        }

        /* Botón de AR personalizado */
        #ar-button {
            background-color: #007bff;
            border-radius: 8px;
            border: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .footer {
            height: 15vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="BodegaJumbo.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-placement="floor"
        camera-controls 
        shadow-intensity="1" 
        auto-rotate
        touch-action="pan-y">
        
        <button slot="ar-button" id="ar-button">
            🚀 VER EN MI ESPACIO (AR)
        </button>

    </model-viewer>

    <div class="footer">
        <p><b>Bodega Jumbo AR</b></p>
        <p style="font-size: 12px; opacity: 0.7;">Escanea el suelo para colocar el plano</p>
    </div>

</body>
</html>
